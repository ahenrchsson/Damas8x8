[package]
name    = "damas-frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
damas-common = { path = "../common" }
damas-game   = { path = "../game" }

leptos        = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }

serde         = { workspace = true }
serde_json    = { workspace = true }
rand          = { workspace = true }

wasm-bindgen  = "0.2"
js-sys        = "0.3"
gloo-timers   = "0.3"
gloo-utils    = "0.2"
gloo-net      = { version = "0.5", features = ["websocket"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version  = "0.3"
features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlDivElement", "MouseEvent", "Event",
    "EventTarget", "Storage", "Location", "History",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent",
    "console",
]

[profile.release]
opt-level = "z"
lto       = true
